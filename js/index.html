<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rod Simulation Demo</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background: #000;
        color: #fff;
      }
      
      .header {
        position: absolute;
        top: 0;
        right: 0;
        z-index: 1001;
        padding: 20px;
        background: rgba(0, 0, 0, 0.8);
        border-bottom-left-radius: 8px;
      }
      
      .header h1 {
        margin: 0 0 5px 0;
        font-size: 24px;
        font-weight: 600;
      }
      
      .header p {
        margin: 0;
        font-size: 14px;
        opacity: 0.7;
      }
      
      #root {
        width: 100vw;
        height: 100vh;
      }
      
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      
      .loading-content {
        text-align: center;
      }
      
      .loading h2 {
        margin: 0 0 10px 0;
        font-size: 28px;
        font-weight: 300;
      }
      
      .loading p {
        margin: 0;
        opacity: 0.8;
        font-size: 16px;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }
        @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Rod Dynamics</h1>
      <p>Interactive Physics Simulation</p>
    </div>
    
    <div id="root">
      <div class="loading">
        <div class="loading-content">
          <h2>Loading Simulation</h2>
          <div class="spinner"></div>
          <p>Initializing WebAssembly physics engine...</p>
        </div>
      </div>
    </div>
    
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
